[package]
name = "proof-verifier"
version = "0.1.0"
description = "ProofXI — CPI de-risk: verify a Txoracle stat proof on-chain and read its bool"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "proof_verifier"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
